<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Scheduler</title>
<!--
  A mock of an old desktop trip-scheduling tool, for agents/computer_use.py to drive.
  It is generic: no real product's name, logo or screens. Its routes and headways are
  made-up sample data, no agency's, and it saves only in memory. window.tripScheduler
  reports what was saved.
-->
<style>
  :root {
    --face: #d4d0c8;
    --light: #ffffff;
    --shadow: #808080;
    --dark: #404040;
    --select: #0a246a;
    --select-text: #ffffff;
    --text: #000000;
    --grey-text: #808080;
    --field: #ffffff;
    /* A harness can keep the bottom of the screen for its own captions. */
    --reserved-bottom: 0px;
    --reserved-right: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #3a6ea5; overflow: hidden; }
  body { font: 16px Tahoma, Verdana, "Segoe UI", sans-serif; color: var(--text); }
  button, input { font: inherit; color: inherit; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .raised { background: var(--face); box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light), inset -2px -2px var(--shadow), inset 2px 2px var(--face); }
  .sunken { box-shadow: inset 1px 1px var(--shadow), inset -1px -1px var(--light), inset 2px 2px var(--dark), inset -2px -2px var(--face); }
  .thin-sunken { box-shadow: inset 1px 1px var(--shadow), inset -1px -1px var(--light); }

  .window { position: fixed; inset: 0 var(--reserved-right) var(--reserved-bottom) 0; display: flex; flex-direction: column; padding: 3px; }
  .titlebar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 6px; color: #fff; font-weight: bold;
    background: linear-gradient(90deg, #0a246a, #3a6ea5 55%, #a6caf0); flex: none; }
  .titlebar.inactive { background: linear-gradient(90deg, #808080, #b5b5b5); color: #d4d0c8; }
  .titlebar svg { flex: none; }
  .titlebar .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption-buttons { display: flex; gap: 2px; }
  .caption-buttons button { width: 26px; height: 22px; padding: 0; border: 0; display: grid; place-items: center; }

  .menubar { display: flex; gap: 0; height: 30px; align-items: stretch; padding: 1px 2px; flex: none; position: relative; }
  .menubar > div { position: relative; }
  .menubar > div > button { height: 100%; padding: 0 10px; border: 0; background: none; }
  .menubar > div > button[aria-expanded="true"] { background: var(--select); color: var(--select-text); }
  .menu { position: absolute; top: 100%; left: 0; min-width: 260px; padding: 3px; z-index: 20; display: none; }
  .menu.open { display: block; }
  .menu button { display: flex; justify-content: space-between; gap: 24px; width: 100%; padding: 5px 22px; border: 0; background: none; text-align: left; }
  .menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--select); color: var(--select-text); outline: none; }
  .menu button:disabled { color: var(--grey-text); text-shadow: 1px 1px var(--light); }
  .menu hr { border: 0; border-top: 1px solid var(--shadow); border-bottom: 1px solid var(--light); margin: 3px 2px; }
  u { text-decoration: underline; }

  .toolbar { display: flex; align-items: center; gap: 2px; height: 50px; padding: 3px 4px; flex: none; border-top: 1px solid var(--light); border-bottom: 1px solid var(--shadow); }
  .toolbar button { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 10px; border: 0; background: none; }
  .toolbar button:hover:not(:disabled) { box-shadow: inset -1px -1px var(--shadow), inset 1px 1px var(--light); }
  .toolbar button:active:not(:disabled) { box-shadow: inset 1px 1px var(--shadow), inset -1px -1px var(--light); }
  .toolbar button:disabled { color: var(--grey-text); }
  .toolbar button:disabled svg { opacity: 0.45; filter: grayscale(1); }
  .toolbar .sep { width: 2px; height: 34px; margin: 0 4px; border-left: 1px solid var(--shadow); border-right: 1px solid var(--light); }

  .main { flex: 1; display: flex; gap: 6px; padding: 6px 4px; min-height: 0; }
  fieldset { margin: 0; padding: 10px 10px 10px; border: 0; box-shadow: inset 1px 1px var(--shadow), inset -1px -1px var(--light), inset 2px 2px var(--light), inset -2px -2px var(--shadow); }
  legend { padding: 0 4px; }

  .routes { width: 400px; flex: none; display: flex; flex-direction: column; gap: 8px; }
  .routes fieldset { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .find { display: flex; align-items: center; gap: 8px; }
  .find input, .field input { height: 30px; padding: 2px 6px; border: 0; background: var(--field); }
  .find input { flex: 1; }
  .listbox { flex: 1; margin: 0; padding: 2px; list-style: none; background: var(--field); overflow: auto; outline: none; }
  .listbox li { height: 32px; line-height: 32px; padding: 0 8px; white-space: nowrap; cursor: default; display: flex; gap: 10px; }
  .listbox li .num { width: 34px; text-align: right; }
  .listbox li[aria-selected="true"] { background: var(--select); color: var(--select-text); }
  .listbox:focus li[aria-selected="true"] { outline: 1px dotted #fff; outline-offset: -2px; }

  .details { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .route-head { display: flex; align-items: baseline; gap: 18px; padding: 4px 4px 0; }
  .route-head h1 { margin: 0; font-size: 22px; }
  .route-head .facts { color: #222; }
  .tabs { display: flex; gap: 0; padding-left: 4px; align-items: flex-end; height: 34px; flex: none; }
  .tabs button { height: 30px; padding: 0 16px; border: 0; background: var(--face); box-shadow: inset 1px 1px var(--light), inset -1px 0 var(--dark), inset -2px 0 var(--shadow); }
  .tabs button[aria-selected="true"] { height: 34px; position: relative; z-index: 1; margin-bottom: -2px; font-weight: bold; }
  .panel { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .grid-wrap { flex: 1; background: var(--field); overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; background: var(--field); }
  th { position: sticky; top: 0; height: 32px; padding: 0 10px; text-align: left; font-weight: normal; background: var(--face);
    box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light), inset -2px -2px var(--shadow); white-space: nowrap; }
  td { height: 36px; padding: 0 10px; border-bottom: 1px solid #e4e2dc; border-right: 1px solid #e4e2dc; white-space: nowrap; cursor: default; }
  td.number, th.number { text-align: right; }
  tr.selected td { background: var(--select); color: var(--select-text); }
  tr.changed td.headway { font-weight: bold; }
  tr.changed td.headway::after { content: " *"; }
  .row-buttons { display: flex; gap: 8px; }
  .button { min-width: 110px; height: 34px; padding: 0 14px; border: 0; }
  .button:active:not(:disabled) { box-shadow: inset 1px 1px var(--dark), inset -1px -1px var(--light); }
  .button:disabled { color: var(--grey-text); text-shadow: 1px 1px var(--light); }
  .button.default { outline: 1px solid #000; outline-offset: -1px; }
  .button:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .pending { padding: 10px; }
  .pending ul { margin: 6px 0 0; padding-left: 22px; }
  .empty { color: #333; padding: 16px; }

  .statusbar { display: flex; gap: 3px; height: 30px; padding-top: 3px; flex: none; }
  .statusbar > div { padding: 0 8px; line-height: 27px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statusbar .message { flex: 1; }
  .progress { width: 160px; height: 20px; margin-top: 4px; padding: 2px; display: none; }
  .progress.on { display: block; }
  .progress span { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--select) 0 12px, transparent 12px 15px); }
  .progress.on span { animation: fill 0.6s steps(10) forwards; }
  @keyframes fill { to { width: 100%; } }

  .modal-cover { position: fixed; inset: 0 var(--reserved-right) var(--reserved-bottom) 0; z-index: 30; display: none; }
  .modal-cover.open { display: block; }
  .dialog { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 600px; padding: 3px; }
  .dialog .titlebar { height: 32px; }
  .dialog-body { padding: 16px 18px 10px; display: grid; grid-template-columns: 170px 1fr; gap: 12px 14px; align-items: center; }
  .dialog-body .value { padding: 3px 0; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field input { width: 90px; text-align: right; }
  .spin { display: flex; flex-direction: column; }
  .spin button { width: 22px; height: 15px; padding: 0; border: 0; display: grid; place-items: center; font-size: 9px; line-height: 1; }
  .hint { color: #333; }
  .error { grid-column: 1 / -1; color: #a00000; min-height: 22px; }
  .dialog-buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 6px 18px 16px; }
</style>
</head>
<body>
<div class="window raised">
  <div class="titlebar" id="titlebar">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="2" y="3" width="18" height="14" rx="2" fill="#f2c94c" stroke="#5a4500"/>
      <rect x="4" y="5" width="6" height="5" fill="#bfe3ff" stroke="#3c5a73"/>
      <rect x="12" y="5" width="6" height="5" fill="#bfe3ff" stroke="#3c5a73"/>
      <rect x="4" y="12" width="14" height="2" fill="#5a4500"/>
      <circle cx="6.5" cy="18.5" r="2" fill="#222"/><circle cx="15.5" cy="18.5" r="2" fill="#222"/>
    </svg>
    <span class="title" id="title">Trip Scheduler - [Winter 2027 board]</span>
    <div class="caption-buttons">
      <button class="raised" type="button" aria-label="Minimize" data-off="Minimize"><svg width="10" height="10" aria-hidden="true"><rect x="1" y="7" width="7" height="2"/></svg></button>
      <button class="raised" type="button" aria-label="Maximize" data-off="Maximize"><svg width="10" height="10" aria-hidden="true"><rect x="0.5" y="0.5" width="8" height="8" fill="none" stroke="#000"/><rect x="0.5" y="0.5" width="8" height="2"/></svg></button>
      <button class="raised" type="button" aria-label="Close" data-off="Exit"><svg width="10" height="10" aria-hidden="true"><path d="M1 1l7 7M8 1L1 8" stroke="#000" stroke-width="1.6"/></svg></button>
    </div>
  </div>

  <div class="menubar" role="menubar" aria-label="Menu" id="menubar">
    <div><button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="file"><u>F</u>ile</button>
      <div class="menu raised" role="menu" id="menu-file" aria-label="File">
        <button type="button" role="menuitem" disabled><span>New board</span><span>Ctrl+N</span></button>
        <button type="button" role="menuitem" disabled><span>Open board...</span><span>Ctrl+O</span></button>
        <button type="button" role="menuitem" data-action="save"><span>Save</span><span>Ctrl+S</span></button>
        <hr>
        <button type="button" role="menuitem" disabled><span>Print...</span><span>Ctrl+P</span></button>
        <hr>
        <button type="button" role="menuitem" data-action="exit"><span>Exit</span><span></span></button>
      </div>
    </div>
    <div><button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="edit"><u>E</u>dit</button>
      <div class="menu raised" role="menu" id="menu-edit" aria-label="Edit">
        <button type="button" role="menuitem" disabled><span>Undo</span><span>Ctrl+Z</span></button>
        <hr>
        <button type="button" role="menuitem" data-action="edit-period"><span>Edit period...</span><span>Enter</span></button>
        <button type="button" role="menuitem" data-action="find"><span>Find route</span><span>Ctrl+F</span></button>
      </div>
    </div>
    <div><button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="view"><u>V</u>iew</button>
      <div class="menu raised" role="menu" id="menu-view" aria-label="View">
        <button type="button" role="menuitem" disabled><span>Timetable</span><span></span></button>
        <button type="button" role="menuitem" disabled><span>Blocks</span><span></span></button>
      </div>
    </div>
    <div><button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="route"><u>R</u>oute</button>
      <div class="menu raised" role="menu" id="menu-route" aria-label="Route">
        <button type="button" role="menuitem" data-action="edit-period"><span>Service period properties...</span><span></span></button>
        <button type="button" role="menuitem" disabled><span>Add period...</span><span></span></button>
      </div>
    </div>
    <div><button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="tools"><u>T</u>ools</button>
      <div class="menu raised" role="menu" id="menu-tools" aria-label="Tools">
        <button type="button" role="menuitem" disabled><span>Run cutting...</span><span></span></button>
        <button type="button" role="menuitem" disabled><span>Options...</span><span></span></button>
      </div>
    </div>
    <div><button type="button" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="help"><u>H</u>elp</button>
      <div class="menu raised" role="menu" id="menu-help" aria-label="Help">
        <button type="button" role="menuitem" data-action="about"><span>About Trip Scheduler</span><span></span></button>
      </div>
    </div>
  </div>

  <div class="toolbar" role="toolbar" aria-label="Tools">
    <button type="button" disabled aria-label="New board">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h10l4 4v16H5z" fill="#fff" stroke="#000"/><path d="M15 2v4h4" fill="none" stroke="#000"/></svg>New</button>
    <button type="button" disabled aria-label="Open board">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h7l2 2h10v12H2z" fill="#f2c94c" stroke="#5a4500"/><path d="M2 20l4-9h17l-4 9z" fill="#ffe08a" stroke="#5a4500"/></svg>Open</button>
    <button type="button" id="save-button" aria-label="Save">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h15l3 3v15H3z" fill="#3c64b4" stroke="#0c2050"/><rect x="7" y="3" width="10" height="7" fill="#e8e8e8" stroke="#0c2050"/><rect x="13" y="4.5" width="2.5" height="4" fill="#3c64b4"/><rect x="6" y="13" width="12" height="8" fill="#fff" stroke="#0c2050"/></svg>Save</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" disabled aria-label="Print">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="7" fill="#fff" stroke="#000"/><rect x="2" y="9" width="20" height="9" fill="#bbb" stroke="#000"/><rect x="6" y="15" width="12" height="7" fill="#fff" stroke="#000"/></svg>Print</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="find-button" aria-label="Find route">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="#dff1ff" stroke="#000" stroke-width="2"/><path d="M14.5 14.5L21 21" stroke="#000" stroke-width="3"/></svg>Find</button>
  </div>

  <div class="main">
    <div class="routes">
      <fieldset>
        <legend>Routes</legend>
        <div class="find"><label for="find">Find:</label><input id="find" class="sunken" autocomplete="off" spellcheck="false"></div>
        <ul class="listbox sunken" id="routes" role="listbox" aria-label="Routes" tabindex="0"></ul>
      </fieldset>
    </div>

    <div class="details" id="details">
      <div class="empty" id="empty">Select a route on the left to see its service periods.</div>
    </div>
  </div>

  <div class="statusbar">
    <div class="message thin-sunken" role="status" id="status">Ready</div>
    <div class="progress thin-sunken" id="progress" aria-hidden="true"><span></span></div>
    <div class="thin-sunken" id="unsaved">No unsaved changes</div>
    <div class="thin-sunken">Board: Winter 2027</div>
    <div class="thin-sunken">Mock legacy app &middot; sample data</div>
  </div>
</div>

<div class="modal-cover" id="cover">
  <div class="dialog raised" role="dialog" aria-modal="true" aria-labelledby="dialog-title" id="dialog">
    <div class="titlebar" id="dialog-bar">
      <span class="title" id="dialog-title">Edit Service Period</span>
      <div class="caption-buttons"><button class="raised" type="button" aria-label="Close" id="dialog-close"><svg width="10" height="10" aria-hidden="true"><path d="M1 1l7 7M8 1L1 8" stroke="#000" stroke-width="1.6"/></svg></button></div>
    </div>
    <form id="period-form" novalidate>
      <div class="dialog-body">
        <span>Route:</span><span class="value" id="d-route"></span>
        <span>Day type:</span><span class="value" id="d-day"></span>
        <span>Period:</span><span class="value" id="d-period"></span>
        <span>Hours:</span><span class="value" id="d-hours"></span>
        <label for="d-headway">Headway (min):</label>
        <div class="field">
          <input id="d-headway" class="sunken" inputmode="numeric" autocomplete="off" aria-describedby="d-hint d-error">
          <div class="spin"><button type="button" class="raised" id="spin-up" tabindex="-1" aria-label="One minute more">&#9650;</button><button type="button" class="raised" id="spin-down" tabindex="-1" aria-label="One minute less">&#9660;</button></div>
          <span class="hint" id="d-hint">minutes between buses</span>
        </div>
        <div class="error" id="d-error" role="alert"></div>
      </div>
      <div class="dialog-buttons">
        <button type="submit" class="button raised default">OK</button>
        <button type="button" class="button raised" id="dialog-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
"use strict";
(() => {
  // Made-up sample data, not any agency's schedule: route numbers the TTC timetable in
  // this repo doesn't use, trees for names, and headways for the mock.
  const PERIODS = [
    ["Weekday", "Early morning", "05:00–06:00"],
    ["Weekday", "Peak", "06:00–09:00, 15:00–19:00"],
    ["Weekday", "Midday", "09:00–15:00"],
    ["Weekday", "Evening", "19:00–01:00"],
    ["Saturday", "All day", "06:00–01:00"],
    ["Sunday", "All day", "08:00–01:00"],
  ];
  const ROUTES = [
    ["601", "Alder", [15, 7, 9, 12, 10, 12]],
    ["602", "Aspen", [20, 10, 15, 20, 15, 20]],
    ["603", "Beech", [30, 15, 20, 30, 30, 30]],
    ["604", "Cedar", [15, 8, 10, 12, 12, 15]],
    ["605", "Elm", [15, 8, 10, 12, 12, 15]],
    ["606", "Hazel", [10, 5, 7, 8, 7, 9]],
    ["607", "Juniper", [12, 6, 8, 10, 9, 12]],
    ["608", "Larch", [10, 5, 7, 9, 8, 10]],
    ["609", "Linden", [10, 5, 7, 9, 8, 10]],
    ["610", "Magnolia", [12, 7, 9, 12, 10, 12]],
    ["611", "Poplar", [12, 7, 9, 12, 10, 12]],
    ["612", "Spruce", [15, 8, 10, 15, 12, 15]],
  ];
  const BASE_TITLE = "Trip Scheduler - [Winter 2027 board]";

  const copy = (value) => JSON.parse(JSON.stringify(value));
  const routes = ROUTES.map(([num, name, headways]) => ({
    num, name,
    periods: PERIODS.map(([day, period, hours], i) => ({ day, period, hours, headway: headways[i] })),
  }));
  let saved = copy(routes);
  const savedLog = [];
  let selected = -1; // route index
  let row = -1; // period index in the selected route
  let editing = null; // { route, row }
  let saving = false;

  const $ = (id) => document.getElementById(id);
  const list = $("routes"), details = $("details"), status = $("status"), find = $("find");

  function label(route) { return `${route.num} ${route.name}`; }
  function periodName(p) { return `${p.day} ${p.period}`; }

  function pending() {
    const changes = [];
    routes.forEach((route, r) => route.periods.forEach((p, i) => {
      const before = saved[r].periods[i].headway;
      if (p.headway !== before) changes.push({ route: label(route), day: p.day, period: p.period, field: "headway", from: before, to: p.headway });
    }));
    return changes;
  }

  function say(text) { status.textContent = text; }

  function renderTitle() {
    const changes = pending();
    $("title").textContent = changes.length ? `${BASE_TITLE} *` : BASE_TITLE;
    $("unsaved").textContent = changes.length === 0 ? "No unsaved changes" : changes.length === 1 ? "1 unsaved change" : `${changes.length} unsaved changes`;
  }

  function renderList() {
    const query = find.value.trim().toLowerCase();
    list.replaceChildren();
    routes.forEach((route, r) => {
      if (query && !label(route).toLowerCase().includes(query)) return;
      const item = document.createElement("li");
      item.role = "option";
      item.id = `route-${route.num}`;
      item.dataset.index = String(r);
      item.setAttribute("aria-selected", String(r === selected));
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = route.num;
      const name = document.createElement("span");
      name.textContent = route.name;
      item.append(num, name);
      list.append(item);
    });
    if (selected >= 0) list.setAttribute("aria-activedescendant", `route-${routes[selected].num}`);
  }

  function renderDetails() {
    if (selected < 0) {
      details.replaceChildren(Object.assign(document.createElement("div"), { className: "empty", textContent: "Select a route on the left to see its service periods." }));
      return;
    }
    const route = routes[selected];
    const changes = pending().filter((c) => c.route === label(route));
    const lastSaved = savedLog.filter((c) => c.route === label(route)).at(-1);
    details.innerHTML = `
      <div class="route-head"><h1>Route ${route.num} - ${route.name}</h1><span class="facts">Mode: Bus &nbsp; Division: North &nbsp; Status: Active</span></div>
      <div class="tabs" role="tablist" aria-label="Route details">
        <button type="button" role="tab" aria-selected="true" class="raised">Service periods</button>
        <button type="button" role="tab" aria-selected="false" data-off="Trip patterns">Trip patterns</button>
        <button type="button" role="tab" aria-selected="false" data-off="Running times">Running times</button>
        <button type="button" role="tab" aria-selected="false" data-off="Notes">Notes</button>
      </div>
      <div class="panel raised" role="tabpanel" aria-label="Service periods">
        <div class="grid-wrap sunken">
          <table aria-label="Service periods for route ${route.num}">
            <thead><tr><th scope="col">Day type</th><th scope="col">Period</th><th scope="col">Hours</th><th scope="col" class="number">Headway (min)</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="row-buttons">
          <button type="button" class="button raised" id="edit-button" ${row < 0 ? "disabled" : ""}>Edit period...</button>
          <button type="button" class="button raised" disabled>Add period...</button>
          <button type="button" class="button raised" disabled>Delete period</button>
        </div>
        <fieldset class="pending"><legend>Changes</legend><div id="changes"></div></fieldset>
      </div>`;
    const body = details.querySelector("tbody");
    route.periods.forEach((p, i) => {
      const tr = document.createElement("tr");
      tr.dataset.row = String(i);
      tr.setAttribute("aria-selected", String(i === row));
      if (i === row) tr.classList.add("selected");
      if (p.headway !== saved[selected].periods[i].headway) tr.classList.add("changed");
      for (const [text, cls] of [[p.day], [p.period], [p.hours], [String(p.headway), "number headway"]]) {
        const td = document.createElement("td");
        td.textContent = text;
        if (cls) td.className = cls;
        tr.append(td);
      }
      body.append(tr);
    });
    const box = details.querySelector("#changes");
    if (changes.length) {
      const ul = document.createElement("ul");
      for (const c of changes) {
        const li = document.createElement("li");
        li.textContent = `${c.day} ${c.period} headway: ${c.from} → ${c.to} min (not saved)`;
        ul.append(li);
      }
      box.replaceChildren(ul);
    } else if (lastSaved) {
      box.textContent = `Saved: ${lastSaved.day} ${lastSaved.period} headway ${lastSaved.from} → ${lastSaved.to} min.`;
    } else {
      box.textContent = "No changes.";
    }
  }

  function render() { renderTitle(); renderList(); renderDetails(); }

  function selectRoute(r) {
    if (r === selected) return;
    selected = r;
    row = -1;
    render();
    say(`${label(routes[r])}: ${routes[r].periods.length} service periods`);
  }

  function selectRow(i) {
    // Rows change in place, so a double-click lands on the row it started on.
    row = i;
    for (const tr of details.querySelectorAll("tbody tr")) {
      const on = Number(tr.dataset.row) === i;
      tr.classList.toggle("selected", on);
      tr.setAttribute("aria-selected", String(on));
    }
    details.querySelector("#edit-button").disabled = false;
    const p = routes[selected].periods[i];
    say(`${periodName(p)}: every ${p.headway} min`);
  }

  // --- The period dialog ---------------------------------------------------
  const cover = $("cover"), input = $("d-headway"), error = $("d-error");
  function openEditor() {
    if (selected < 0) { say("Select a route first."); return; }
    if (row < 0) { say("Select a service period first."); return; }
    closeMenus();
    editing = { route: selected, row };
    const route = routes[selected], p = route.periods[row];
    $("d-route").textContent = label(route);
    $("d-day").textContent = p.day;
    $("d-period").textContent = p.period;
    $("d-hours").textContent = p.hours;
    $("dialog-title").textContent = `Edit Service Period - ${label(route)}`;
    input.value = String(p.headway);
    error.textContent = "";
    cover.classList.add("open");
    $("titlebar").classList.add("inactive");
    input.focus();
    input.select();
  }
  function closeEditor() {
    editing = null;
    cover.classList.remove("open");
    $("titlebar").classList.remove("inactive");
    list.focus();
  }
  function commitEditor() {
    const text = input.value.trim();
    const minutes = Number(text);
    if (!/^\d+$/.test(text) || minutes < 2 || minutes > 60) {
      error.textContent = "Enter a whole number of minutes from 2 to 60.";
      input.focus();
      input.select();
      return;
    }
    const p = routes[editing.route].periods[editing.row];
    const before = p.headway;
    p.headway = minutes;
    const name = label(routes[editing.route]);
    closeEditor();
    render();
    say(before === minutes ? `${periodName(p)} headway unchanged.` : `${name}: ${periodName(p)} headway changed from ${before} to ${minutes} min. Not saved yet.`);
  }
  $("period-form").addEventListener("submit", (event) => { event.preventDefault(); commitEditor(); });
  $("dialog-cancel").addEventListener("click", closeEditor);
  $("dialog-close").addEventListener("click", closeEditor);
  $("spin-up").addEventListener("click", () => { input.value = String(Math.min(60, (Number(input.value) || 0) + 1)); input.focus(); });
  $("spin-down").addEventListener("click", () => { input.value = String(Math.max(2, (Number(input.value) || 3) - 1)); input.focus(); });
  cover.addEventListener("mousedown", (event) => {
    if (event.target !== cover) return;
    // A click outside a modal dialog only flashes its title bar.
    event.preventDefault();
    const bar = $("dialog-bar");
    bar.classList.add("inactive");
    setTimeout(() => bar.classList.remove("inactive"), 120);
  });

  // --- Saving ----------------------------------------------------------------
  function save() {
    closeMenus();
    if (editing) { say("Close the Edit Service Period window first."); return; }
    if (saving) return;
    const changes = pending();
    if (!changes.length) { say("No changes to save."); return; }
    saving = true;
    say("Saving...");
    $("progress").classList.add("on");
    setTimeout(() => {
      saved = copy(routes);
      savedLog.push(...changes);
      saving = false;
      $("progress").classList.remove("on");
      render();
      say("Saved. " + changes.map((c) => `${c.route}: ${c.day} ${c.period} headway ${c.from} → ${c.to} min.`).join(" "));
    }, 600);
  }

  // --- Menus -----------------------------------------------------------------
  function closeMenus() {
    for (const button of document.querySelectorAll("[data-menu]")) button.setAttribute("aria-expanded", "false");
    for (const menu of document.querySelectorAll(".menu")) menu.classList.remove("open");
  }
  for (const button of document.querySelectorAll("[data-menu]")) {
    button.addEventListener("click", () => {
      const open = button.getAttribute("aria-expanded") === "true";
      closeMenus();
      if (!open) {
        button.setAttribute("aria-expanded", "true");
        $(`menu-${button.dataset.menu}`).classList.add("open");
      }
    });
  }
  document.addEventListener("mousedown", (event) => { if (!event.target.closest(".menubar")) closeMenus(); });
  const ACTIONS = {
    save,
    "edit-period": openEditor,
    find: () => { closeMenus(); find.focus(); find.select(); },
    exit: () => { closeMenus(); say("Exit is turned off in this mock."); },
    about: () => { closeMenus(); say("Trip Scheduler: a mock legacy app with sample data, for a computer-use demo."); },
  };
  for (const item of document.querySelectorAll(".menu [data-action]")) item.addEventListener("click", () => ACTIONS[item.dataset.action]());
  $("save-button").addEventListener("click", save);
  $("find-button").addEventListener("click", ACTIONS.find);
  document.addEventListener("click", (event) => {
    const off = event.target.closest("[data-off]");
    if (off) say(`${off.dataset.off} is not part of this mock.`);
  });

  // --- Routes and rows ---------------------------------------------------------
  list.addEventListener("mousedown", (event) => {
    const item = event.target.closest("li[data-index]");
    if (item) selectRoute(Number(item.dataset.index));
  });
  list.addEventListener("keydown", (event) => {
    const shown = [...list.querySelectorAll("li[data-index]")].map((li) => Number(li.dataset.index));
    if (!shown.length) return;
    const at = shown.indexOf(selected);
    if (event.key === "ArrowDown") { event.preventDefault(); selectRoute(shown[Math.min(shown.length - 1, at + 1)]); }
    if (event.key === "ArrowUp") { event.preventDefault(); selectRoute(shown[Math.max(0, at - 1)]); }
  });
  find.addEventListener("input", () => {
    renderList();
    const first = list.querySelector("li[data-index]");
    if (first && find.value.trim()) selectRoute(Number(first.dataset.index));
  });
  details.addEventListener("mousedown", (event) => {
    const tr = event.target.closest("tbody tr");
    if (tr) selectRow(Number(tr.dataset.row));
  });
  details.addEventListener("dblclick", (event) => {
    const tr = event.target.closest("tbody tr");
    if (tr) { selectRow(Number(tr.dataset.row)); openEditor(); }
  });
  details.addEventListener("click", (event) => { if (event.target.closest("#edit-button")) openEditor(); });

  document.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    if ((event.ctrlKey || event.metaKey) && key === "s") { event.preventDefault(); save(); return; }
    if ((event.ctrlKey || event.metaKey) && key === "f") { event.preventDefault(); ACTIONS.find(); return; }
    if (event.key === "Escape") { if (editing) closeEditor(); else closeMenus(); return; }
    if (event.key === "Enter" && !editing && row >= 0 && !event.target.closest("input, button")) { event.preventDefault(); openEditor(); }
  });

  // What has been saved, for the harness that drives this page. Each change is
  // { route, day, period, field, from, to }, oldest first. busy is true while saving.
  window.tripScheduler = Object.freeze({
    changes: () => copy(savedLog),
    unsaved: () => pending(),
    busy: () => saving,
  });

  render();
})();
</script>
</body>
</html>
