# On every push and pull request: the checks that need no real model and cost nothing.
# A red check means don't deploy. scripts/smoke.ts, in smoke.yml, checks the live site.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The service, the display, the evals' scoring and the clients: types, unit tests,
  # and the display's build, as the Dockerfile runs it.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The agents, against a throwaway service and a fake Gemini, so no call costs money.
  # test_deploy.py reads fly.toml and start.sh: the settings the public demo runs on.
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # pdftotext and ffmpeg, as in the Dockerfile, for the tests that read PDFs and video.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - uses: astral-sh/setup-uv@v5
      - run: uv venv agents/.venv --python 3.14 && uv pip install --python agents/.venv/bin/python -r agents/requirements.txt
      - run: npm run agent:test

  # The image Fly runs, built but not pushed, so a broken Dockerfile shows here first.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
